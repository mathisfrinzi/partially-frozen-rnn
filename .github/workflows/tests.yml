name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer (numpy seulement ; les tests PyTorch sont ignorés)
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Démo
        env:
          HFRNN_RESULTS_DIR: /tmp/ci-results
          MPLBACKEND: Agg
        run: python experiments/01_esn_demo.py
